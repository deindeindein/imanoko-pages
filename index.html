<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いまのこ ― なんでもない日の顔を残す</title>
<meta name="description" content="子どもVlogが、5秒撮るだけでできる！通知が来たら5秒撮るだけの、子どもの動画アプリ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Yomogi&display=swap">
<style>
/*
  土台: ストア画像（桃色の地・丸ゴシック・強調は橙）
  借りたもの:
    Superr   … 紙の地、橙の手書き風の添え書き、強調語の下のマーカー線、傾けて置いた写真、影はごく薄く、見出しは左揃え
    Foodnoms … 見出し → App Store ボタン → 画面 の順、セクション間 96px
*/
:root {
  --paper: #fcf4ef;      /* 紙の地（Superr の Cream Paper を桃色へ寄せた） */
  --peach: #f6dccf;      /* ストア画像の桃色（一段濃い面） */
  --peach-deep: #efc3ae; /* ストア画像のグラデーションの下端 */
  --ink: #2b1a12;        /* 文字（Superr の Cocoa Ink） */
  --ink-soft: #6b5347;
  --orange: #ff5a0a;     /* ストア画像の「Vlog」の橙 */
  --orange-ink: #c9500d; /* 紙の上で小さい字に使う濃い橙（Superr の Burnt Sienna 相当） */
  --marker: #ffc9a8;     /* 強調語の下のマーカー線 */
  --shadow: 0 1px 2px rgba(43,26,18,.06), 0 8px 24px rgba(43,26,18,.08);
  --maru: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --hand: "Yomogi", "Klee One", "Hiragino Maru Gothic ProN", cursive;
  --gap-section: 96px;   /* Foodnoms */
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--maru);
  font-weight: 500;
  line-height: 1.8;
  overflow-x: clip;
}
img, video { display: block; max-width: 100%; }
a { color: inherit; }
a:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 8px; }

.wrap { width: min(1080px, 100% - 40px); margin-inline: auto; }

/* ---- 上の帯 ---- */
.top { padding: 18px 0; }
.top .wrap { display: flex; align-items: center; gap: 10px; }
.top img { width: 36px; height: 36px; border-radius: 9px; }
.top b { font-weight: 900; font-size: 20px; letter-spacing: .02em; }

/* ---- 共通の文字 ---- */
.eyebrow { margin: 0 0 12px; color: var(--ink-soft); font-size: 15px; letter-spacing: .08em; }
h1, h2, .say { font-weight: 900; line-height: 1.3; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(38px, 9.6vw, 68px); }
h2 { font-size: clamp(28px, 7vw, 44px); }
em { font-style: normal; color: var(--orange); }
.marker {
  font-style: normal; color: var(--orange);
  background: linear-gradient(transparent 68%, var(--marker) 68% 92%, transparent 92%);
  padding: 0 .06em;
}
.hand {
  font-family: var(--hand); color: var(--orange-ink);
  font-size: clamp(18px, 5vw, 22px); line-height: 1.4; white-space: nowrap;
  display: inline-block; transform: rotate(-4deg);
}
.hand::before { content: "↳ "; }

/* ---- App Store バッジ（Apple 公式の画像。形・色を変えない） ---- */
.store { display: inline-block; margin-top: 28px; border-radius: 10px; }
.store img { height: 54px; width: auto; }

/* ---- 1画面目 ---- */
.hero { padding: 24px 0 var(--gap-section); overflow-x: clip; }
.hero .wrap { display: grid; gap: 48px; align-items: center; }
.hero-visual { position: relative; justify-self: center; width: min(300px, 76vw); }
.phone {
  position: relative; aspect-ratio: 9 / 19.5; border-radius: 48px;
  background: #111; padding: 10px; box-shadow: var(--shadow);
}
.phone video { width: 100%; height: 100%; object-fit: cover; border-radius: 38px; background: var(--peach); }
.phone::after { /* ダイナミックアイランド */
  content: ""; position: absolute; top: 22px; left: 50%; translate: -50% 0;
  width: 30%; height: 26px; background: #000; border-radius: 20px;
}
.card {
  position: absolute; margin: 0; width: 42%; aspect-ratio: 9 / 16;
  border: 5px solid #fff; border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow); background: var(--peach);
}
.card video { width: 100%; height: 100%; object-fit: cover; }
.hero .c1 { left: -30%; top: 14%; rotate: -9deg; }
.hero .c2 { right: -28%; bottom: 10%; rotate: 7deg; }

/* ---- 桃色の面（ストア画像の地） ---- */
.band {
  background: linear-gradient(180deg, var(--peach) 0%, var(--peach-deep) 100%);
  border-radius: 56px 56px 0 0;
  padding: var(--gap-section) 0;
}
.band + .band { border-radius: 0; }
.band.light { background: var(--paper); }

/* ---- 通知 ---- */
.notice .wrap { display: grid; gap: 40px; }
.bubble {
  position: relative; justify-self: start; max-width: 520px;
  background: #9dbcbd; color: var(--ink);
  font-weight: 900; font-size: clamp(22px, 5.6vw, 32px); line-height: 1.45;
  padding: 22px 28px; border-radius: 40px;
}
.bubble::after {
  content: ""; position: absolute; left: 44px; bottom: -18px;
  width: 26px; height: 26px; background: #9dbcbd; border-radius: 50%;
}
.banner {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  max-width: 440px; padding: 14px 16px; border-radius: 24px;
  background: rgba(255,255,255,.72); box-shadow: var(--shadow);
  font-family: -apple-system, "Hiragino Sans", system-ui, sans-serif; line-height: 1.35;
}
.banner img { width: 44px; height: 44px; border-radius: 11px; }
.banner b { font-size: 15px; }
.banner p { margin: 0; font-size: 15px; }
.banner time { align-self: start; font-size: 13px; color: #7a6a62; }

/* ---- 見返す ---- */
.look .wrap { display: grid; gap: 36px; }
.look .say { font-size: clamp(24px, 6.2vw, 38px); }
.pair { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 520px; }
.pair figure { margin: 0; position: relative; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; border: 5px solid #fff; box-shadow: var(--shadow); }
.pair figure:first-child { rotate: -3deg; }
.pair figure:last-child { rotate: 3deg; translate: 0 18px; }
.pair video { width: 100%; height: 100%; object-fit: cover; }
.burn { /* アプリが焼き込む日付と月齢の見た目の仮 */
  position: absolute; left: 10px; bottom: 10px; right: 10px;
  color: #fff; font-weight: 700; font-size: 13px; line-height: 1.35;
  text-shadow: 0 1px 3px rgba(0,0,0,.55);
}

/* ---- 残す・渡す ---- */
.keep .wrap { display: grid; gap: 28px; }
.keep p.lead { margin: 0; font-weight: 900; font-size: clamp(22px, 5.6vw, 32px); line-height: 1.45; }
.fan { position: relative; height: 420px; margin-top: 12px; }
.fan figure { position: absolute; margin: 0; width: 44%; max-width: 220px; aspect-ratio: 9/16; border: 5px solid #fff; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.fan video { width: 100%; height: 100%; object-fit: cover; }
.fan .f1 { left: 2%;  top: 60px; rotate: -8deg; }
.fan .f2 { left: 22%; top: 0;    rotate: -3deg; }
.fan .f3 { right: 2%; top: 50px; rotate: 7deg; }
.fan .f4 { left: 50%; top: 80px; translate: -50% 0; rotate: -1deg; width: 50%; max-width: 250px; z-index: 2; }

/* ---- 下 ---- */
.foot { padding: 48px 0 56px; font-size: 14px; color: var(--ink-soft); }
.foot nav ul { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; }
.foot a { text-underline-offset: 3px; }

/* ---- 広い画面 ---- */
@media (min-width: 860px) {
  .hero .wrap { grid-template-columns: 1.1fr .9fr; }
  .hero-visual { width: 320px; }
  .notice .wrap { grid-template-columns: 1fr 1fr; align-items: center; }
  .notice .bubble { grid-column: 1 / -1; }
  .look .wrap { grid-template-columns: 1fr 1fr; align-items: center; column-gap: 64px; }
  .look .say.top { grid-column: 1 / -1; }
  .look .pair { grid-row: 2 / 4; }
  .keep .wrap { grid-template-columns: 1fr 1fr; align-items: center; column-gap: 64px; }
  .keep .fan { grid-column: 2; grid-row: 1 / 4; }
}

@media (prefers-reduced-motion: reduce) {
  .card, .pair figure, .fan figure, .hand { rotate: 0deg; transform: none; }
}

</style>
</head>
<body>

<header class="top">
  <div class="wrap"><img src="media/icon.png" alt=""><b>いまのこ</b></div>
</header>

<main>
  <section class="hero">
    <div class="wrap">

      <div>

        <figure class="f2"><video src="media/clip-3.mp4" poster="media/clip-3.jpg" preload="metadata" autoplay muted loop playsinline></video></figure>

</main>

<script>
(() => {
  const vids = [...document.querySelectorAll("video")];
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting && !still.matches) e.target.play().catch(() => {});
      else e.target.pause();
    }
  }, { threshold: 0.25 });
  vids.forEach((v) => { v.removeAttribute("autoplay"); io.observe(v); });
})();
</script>
