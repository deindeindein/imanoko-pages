name: SNS トークン更新

on:
  schedule:
    # 毎週月曜 09:00 JST。長期トークン（60日）を切らさないため。
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Secrets への書き戻しに NaCl の sealed box が要る。
      # GH_SECRETS_TOKEN が無い運用では使わないので --no-save で足りる。
      - name: 暗号化ライブラリを用意
        run: npm install --no-save libsodium-wrappers

      - name: トークンを更新
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_API_BASE: ${{ vars.THREADS_API_BASE }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-tokens.mjs
