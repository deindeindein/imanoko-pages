name: レビュー取得

on:
  schedule:
    # 毎日 09:00 JST（00:00 UTC）
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      notify_first_run:
        description: "保存データが空でも Slack に通知する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: レビューを取得して Slack に通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/fetch-reviews.mjs ${{ inputs.notify_first_run && '--notify-first-run' || '' }}

      - name: 変更をコミット
        run: |
          if git diff --quiet -- data; then
            echo "更新はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "レビューデータを更新"
          for delay in 0 2 4 8; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          exit 1
