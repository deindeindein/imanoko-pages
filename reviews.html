<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レビュー | いまのこ</title>
  <style>
    :root { color-scheme: light dark; --accent: #d95757; --line: color-mix(in srgb, currentColor 18%, transparent); --muted: color-mix(in srgb, currentColor 60%, transparent); }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.75; }
    main { box-sizing: border-box; max-width: 860px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { line-height: 1.3; margin-bottom: 0.2em; }
    a { color: var(--accent); }
    .updated { color: var(--muted); font-size: 0.9rem; margin-top: 0; }
    .summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 96px; }
    .stat dt { font-size: 0.78rem; color: var(--muted); margin: 0; }
    .stat dd { margin: 0; font-size: 1.4rem; font-weight: 600; line-height: 1.4; }
    .dist { margin: 0 0 24px; padding: 0; list-style: none; max-width: 420px; }
    .dist li { display: grid; grid-template-columns: 5.6em 1fr 2.4em; align-items: center; gap: 8px; font-size: 0.9rem; }
    .bar { background: var(--line); border-radius: 4px; height: 8px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .filters label { display: flex; flex-direction: column; font-size: 0.78rem; color: var(--muted); }
    .filters select, .filters input { font: inherit; font-size: 0.95rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
    .review { border-top: 1px solid var(--line); padding: 16px 0; }
    .review:last-child { border-bottom: 1px solid var(--line); }
    .review h2 { font-size: 1.02rem; margin: 0 0 4px; line-height: 1.5; }
    .stars { color: var(--accent); letter-spacing: 0.1em; white-space: nowrap; }
    .meta { color: var(--muted); font-size: 0.82rem; margin: 0 0 8px; }
    .body { margin: 0; white-space: pre-wrap; }
    .low { border-left: 3px solid var(--accent); padding-left: 14px; }
    .empty { color: var(--muted); padding: 32px 0; }
  </style>
</head>
<body>
  <main>
    <p><a href="index.html">いまのこ</a></p>
    <h1>レビュー</h1>
    <p class="updated" id="updated"></p>

    <dl class="summary" id="summary"></dl>
    <ul class="dist" id="dist"></ul>

    <div class="filters">
      <label>アプリ<select id="f-app"></select></label>
      <label>国<select id="f-country"></select></label>
      <label>評価<select id="f-rating">
        <option value="">すべて</option>
        <option value="low">★1〜2</option>
        <option value="5">★5</option>
        <option value="4">★4</option>
        <option value="3">★3</option>
        <option value="2">★2</option>
        <option value="1">★1</option>
      </select></label>
      <label>キーワード<input id="f-text" type="search" placeholder="本文・タイトル"></label>
    </div>

    <div id="list"></div>
  </main>

  <script src="data/reviews.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const state = { reviews: [] };

    load();

    async function load() {
      let data = window.__REVIEWS__;
      if (!data) {
        try {
          data = await (await fetch("data/reviews.json")).json();
        } catch {
          el("list").innerHTML = '<p class="empty">レビューデータを読み込めませんでした。scripts/fetch-reviews.mjs を実行してください。</p>';
          return;
        }
      }
      state.reviews = data.reviews ?? [];
      el("updated").textContent = data.generatedAt ? `最終取得 ${formatDate(data.generatedAt)}` : "";
      fillOptions("f-app", state.reviews.map((r) => r.appName));
      fillOptions("f-country", state.reviews.map((r) => r.country.toUpperCase()));
      for (const id of ["f-app", "f-country", "f-rating", "f-text"]) {
        el(id).addEventListener("input", render);
      }
      render();
    }

    function fillOptions(id, values) {
      const select = el(id);
      const unique = [...new Set(values)].sort();
      select.innerHTML = '<option value="">すべて</option>' + unique.map((v) => `<option>${escapeHtml(v)}</option>`).join("");
      if (unique.length <= 1) select.parentElement.hidden = true;
    }

    function render() {
      const app = el("f-app").value;
      const country = el("f-country").value;
      const rating = el("f-rating").value;
      const text = el("f-text").value.trim().toLowerCase();

      const rows = state.reviews.filter((r) => {
        if (app && r.appName !== app) return false;
        if (country && r.country.toUpperCase() !== country) return false;
        if (rating === "low" ? r.rating > 2 : rating && r.rating !== Number(rating)) return false;
        if (text && !`${r.title} ${r.body} ${r.author}`.toLowerCase().includes(text)) return false;
        return true;
      });

      renderSummary(rows);
      el("list").innerHTML = rows.length > 0
        ? rows.map(card).join("")
        : state.reviews.length === 0
          ? '<p class="empty">まだレビューデータがありません。GitHub Actions の「レビュー取得」を実行するか、node scripts/fetch-reviews.mjs を実行してください。</p>'
          : '<p class="empty">該当するレビューはありません。</p>';
    }

    function renderSummary(rows) {
      const total = rows.length;
      const average = total ? (rows.reduce((sum, r) => sum + r.rating, 0) / total).toFixed(2) : "–";
      const low = rows.filter((r) => r.rating <= 2).length;
      el("summary").innerHTML = [
        ["件数", total],
        ["平均", average],
        ["★1〜2", low],
      ].map(([label, value]) => `<div class="stat"><dt>${label}</dt><dd>${value}</dd></div>`).join("");

      const max = Math.max(1, ...[1, 2, 3, 4, 5].map((n) => rows.filter((r) => r.rating === n).length));
      el("dist").innerHTML = [5, 4, 3, 2, 1].map((n) => {
        const count = rows.filter((r) => r.rating === n).length;
        return `<li><span class="stars">${"★".repeat(n)}</span><span class="bar"><span style="width:${(count / max) * 100}%"></span></span><span>${count}</span></li>`;
      }).join("");
    }

    function card(r) {
      const meta = [r.appName, r.country.toUpperCase(), r.version && `v${r.version}`, r.author, formatDate(r.updatedAt ?? r.firstSeenAt)]
        .filter(Boolean).map(escapeHtml).join(" ・ ");
      return `<article class="review${r.rating <= 2 ? " low" : ""}">
        <h2><span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span> ${escapeHtml(r.title || "(タイトルなし)")}</h2>
        <p class="meta">${meta} ・ <a href="${escapeHtml(r.url)}" rel="noopener">App Store</a></p>
        <p class="body">${escapeHtml(r.body)}</p>
      </article>`;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleString("ja-JP", { dateStyle: "medium", timeStyle: "short" });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
